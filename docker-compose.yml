version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - ./packages/database/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paypro-network

  bank-webhook:
    build:
      context: .
      dockerfile: docker/webhook.Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://user:password@postgres:5432/payments
      WEBHOOK_SECRET: bank_webhook_secret_key_12345
      JWT_SECRET: jwt_secret_key_for_authentication
      API_KEY: your_api_key_here
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - paypro-network

  user-app:
    build:
      context: .
      dockerfile: docker/user.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://bank-webhook:3002
      DATABASE_URL: postgresql://user:password@postgres:5432/payments
      JWT_SECRET: jwt_secret_key_for_authentication
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: your_nextauth_secret_key_here
    depends_on:
      - postgres
      - bank-webhook
    restart: unless-stopped
    networks:
      - paypro-network

  merchant-app:
    build:
      context: .
      dockerfile: docker/merchant.Dockerfile
    ports:
      - "3003:3003"
    environment:
      NEXT_PUBLIC_API_URL: http://bank-webhook:3002
      DATABASE_URL: postgresql://user:password@postgres:5432/payments
      JWT_SECRET: jwt_secret_key_for_authentication
      NEXTAUTH_URL: http://localhost:3002
      NEXTAUTH_SECRET: your_nextauth_secret_key_here_merchant
    depends_on:
      - postgres
      - bank-webhook
    restart: unless-stopped
    networks:
      - paypro-network

volumes:
  postgres_data:

networks:
  paypro-network:
    driver: bridge
